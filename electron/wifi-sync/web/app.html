<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32654c">
  <title>Still</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/chat.css">
  <script defer src="/chat.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <section id="pair-screen" hidden>
    <div class="pair-card">
      <div class="logo">s</div>
      <h1>Connect to your library</h1>
      <p>Scan the QR code in the desktop app (Wi-Fi Sync → Show pairing code), or type the code here.</p>
      <input id="code" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH" aria-label="Pairing code">
      <input id="device-name" autocomplete="off" placeholder="Device name" aria-label="Device name">
      <button id="pair" type="button" class="primary">Pair this phone</button>
      <p id="pair-message" class="error" role="status"></p>
    </div>
  </section>

  <section id="login-screen" hidden>
    <form class="pair-card" id="login-form">
      <div class="logo">s</div>
      <h1>Sign in</h1>
      <p>Use the account that is signed in on your computer.</p>
      <input id="login-email" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-message" class="error" role="status"></p>
    </form>
  </section>

  <div id="library-screen" hidden>
    <header class="top">
      <div class="top-row">
        <h1>Your library</h1>
        <div class="spacer"></div>
        <button id="select-toggle" class="text-btn" type="button">Select</button>
        <button id="menu" class="icon" aria-label="Menu">⋮</button>
      </div>
      <div id="select-bar" class="select-bar" hidden>
        <button id="select-cancel" class="icon" type="button" aria-label="Cancel selection">✕</button>
        <strong id="select-count">0 selected</strong>
        <div class="spacer"></div>
        <button id="select-all" class="text-btn" type="button">All</button>
        <button id="select-delete" class="text-btn danger-text" type="button">Delete</button>
      </div>
      <div class="menu-panel" id="menu-panel" hidden>
        <p id="account-line"></p>
        <label>Library <select id="library-select"></select></label>
        <a href="/device" class="menu-link">Manage this phone's photos</a>
        <a href="/pair" class="menu-link">Send photos to this computer</a>
        <button id="logout" type="button" hidden>Sign out</button>
        <button id="unpair" type="button" class="danger">Unpair this phone</button>
      </div>
      <input id="search" type="search" placeholder="Search files and tags" aria-label="Search">
      <nav id="tabs" class="tabs" aria-label="Category"></nav>
    </header>
    <main>
      <div id="folders" class="folders" hidden></div>
      <div id="grid" class="grid" role="list"></div>
      <div id="roadmap" class="roadmap" hidden></div>
      <p id="status" class="status" role="status"></p>
      <div id="sentinel"></div>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Pages">
      <button data-nav="library" type="button"><span aria-hidden="true">▦</span>Library</button>
      <button data-nav="folders" type="button"><span aria-hidden="true">📁</span>Folders</button>
      <button data-nav="timeline" type="button"><span aria-hidden="true">🗓</span>Timeline</button>
      <button data-nav="favorites" type="button"><span aria-hidden="true">♥</span>Favorites</button>
      <button data-nav="more" type="button"><span aria-hidden="true">☰</span>More</button>
    </nav>
  </div>

  <div id="viewer" hidden>
    <div class="viewer-bar">
      <button id="viewer-close" class="icon" aria-label="Close">✕</button>
      <span id="viewer-title"></span>
      <button id="viewer-share" class="icon" aria-label="Share" title="Share">⤴</button>
      <button id="viewer-fav" class="icon" aria-label="Favorite" aria-pressed="false">♡</button>
    </div>
    <div id="viewer-stage"></div>
    <button id="viewer-prev" class="nav prev" aria-label="Previous">‹</button>
    <button id="viewer-next" class="nav next" aria-label="Next">›</button>
  </div>
</body>
</html>
